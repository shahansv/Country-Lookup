<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark text-light">
    <h1 class="text-center mt-3">Country Lookup</h1>
    <div class="d-flex align-items-center justify-content-center m-5">
      <input
        type="text"
        placeholder="Enter Country Name"
        class="m-2 rounded-2 p-1 border-0"
        id="countryInput"
      />
      <button class="btn btn-primary m-2" onclick="search()">Search</button>
    </div>

    <div id="result"></div>
  </body>
  <script>
    const search = async () => {
      let country = countryInput.value.trim();
      if (country !== "") {
        console.log(country);
        //API call
        let apiResonse = await fetch(
          `https://restcountries.com/v3.1/name/${country}`
        );
        let data = await apiResonse.json();
        if (apiResonse.status == 200) {
          console.log(data[0]);
          data = data[0];
          countryCode = Object.keys(data.currencies)[0];
          console.log(countryCode);

          let lang = Object.values(data.languages);
          console.log(lang);

          result.innerHTML = `<div class="container d-flex justify-content-between">
        <div>
            <h3>Country Name : ${data.name.common}</h3>
            <h3>Official Name :  ${data.name.official}</h3>
            <h3>Capital :  ${data.capital}</h3>
            <h3>Population : ${data.population}</h3>
            <h3>TimeZone : ${data.timezones}</h3>
            <h3>Currencies : ${data.currencies[countryCode].name}</h3>
            <h3>Languages : ${lang}</h3>
            <h3><img src="${data.flags.png}" alt=""></h3>
        </div>

    </div>`;
        } else {
          alert(data.message);
        }
      } else {
        alert("Please enter a country name");
      }
    };
  </script>
</html>
